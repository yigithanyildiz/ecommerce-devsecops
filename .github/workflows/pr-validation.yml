name: PR Validation

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ecommerce:ecommerce_password@localhost:5432/ecommerce_dev?schema=public
        
      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Run dependency audit
        run: npm audit --audit-level=high
        
      - name: Build backend
        run: npm run build

  admin-web-validation:
    name: Admin Web Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit
        run: npm audit --audit-level=high

      - name: Build admin web
        run: npm run build

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - admin-web-validation

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - admin-web-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem and config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: 1

      - name: Generate Trivy SARIF report
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,config,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          exit-code: 0

      - name: Upload Trivy SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          if-no-files-found: ignore

  sast-semgrep:
    name: SAST Semgrep
    runs-on: ubuntu-latest
    needs:
      - backend-validation
      - admin-web-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            returntocorp/semgrep:latest \
            semgrep scan \
            --config p/owasp-top-ten \
            --sarif \
            --output /src/semgrep.sarif \
            /src

      - name: Upload Semgrep SARIF
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sast-report
          path: semgrep.sarif
          if-no-files-found: ignore
