services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
        APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
    container_name: ecommerce-api-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      APP_BUILD_TIME: ${APP_BUILD_TIME:-unknown}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups/prod}
      RETENTION_DAYS: ${RETENTION_DAYS:-14}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /opt/ecommerce/app/backups/prod:/app/backups/prod:ro
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    build:
      context: ../../admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://api.yigithanyildiz.com
    container_name: ecommerce-admin-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"

  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
